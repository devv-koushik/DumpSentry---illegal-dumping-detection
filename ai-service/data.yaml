# DumpSentry YOLOv11 Waste Detection Dataset Configuration

path: ./dataset # dataset root dir
train: train/images # train images (relative to 'path')
val: val/images # val images (relative to 'path')
test: test/images # test images (optional)

# Number of classes
nc: 13

# Class names mapping
names:
  0: construction_waste
  1: appliances
  2: electronic_waste
  3: furniture
  4: metal_waste
  5: plastic_waste
  6: wood_waste
  7: vehicle_waste
  8: tyre_waste
  9: paper_waste
  10: asbestos
  11: textile_waste
  12: mixed_waste
